<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>House of Viyora - Sales Entry</title>
  <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; background: #f1f3f7; color: #0f172a; font-family: 'Plus Jakarta Sans', sans-serif; }
    .app-container { width: 100%; min-height: 100vh; padding: 16px 12px 60px 12px; display: flex; flex-direction: column; }
    .app-header { width: 100%; text-align: center; padding: 6px 0 18px 0; }
    .logo { display: block; width: 70px; height: 70px; object-fit: cover; border-radius: 50%; margin: 0 auto 12px auto; box-shadow: 0 6px 20px rgba(0,0,0,0.12); border: 3px solid #ffffff; }
    .brand-name { font-size: 15px; font-weight: 900; color: #090d16; }
    .page-title { font-size: 13px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 4px; }
    .card { width: 100%; background: #ffffff; border-radius: 20px; padding: 18px 16px; margin-bottom: 16px; box-shadow: 0 3px 16px rgba(0, 0, 0, 0.05); border: 1.5px solid #e2e8f0; }
    textarea { display: block; width: 100%; height: 130px; padding: 14px; border: 2px solid #cbd5e1; border-radius: 16px; background: #f8fafc; color: #0f172a; font-family: monospace; font-size: 18px; font-weight: 700; outline: none; resize: vertical; }
    
    .live-calc-box { margin-top: 14px; background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 16px; padding: 14px; }
    .live-item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    .live-item-left { display: flex; align-items: center; gap: 10px; }
    .live-item-thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; border: 1px solid #cbd5e1; background: #e2e8f0; flex-shrink: 0; }
    .live-item-title { font-weight: 800; color: #0f172a; }
    .live-item-sub { font-size: 12px; color: #64748b; font-weight: 600; }
    .live-item-price { font-weight: 900; color: #15803d; }
    .live-total-bar { margin-top: 10px; padding-top: 10px; border-top: 2px dashed #cbd5e1; display: flex; justify-content: space-between; align-items: center; font-weight: 900; font-size: 16px; }
    
    button { display: block; width: 100%; min-height: 54px; margin-top: 14px; padding: 14px 16px; border: 0; border-radius: 16px; font-family: inherit; font-size: 17px; font-weight: 900; cursor: pointer; text-align: center; }
    .confirm { background: #15803d; color: #ffffff; box-shadow: 0 5px 16px rgba(21, 128, 61, 0.25); }
    .secondary { background: #e2e8f0; color: #1e293b; }
    .error { width: 100%; display: none; margin-bottom: 16px; padding: 16px; border-radius: 14px; background: #fef2f2; color: #991b1b; border: 2px solid #fecaca; font-size: 15px; font-weight: 700; }
    .loading { display: none; width: 100%; padding: 18px; text-align: center; color: #0f172a; font-size: 18px; font-weight: 800; }
    .hidden { display: none !important; }
    
    .final-bill-box { width: 100%; margin-top: 16px; padding: 16px; border-radius: 16px; background: #f0fdf4; border: 2px solid #86efac; }
    .final-bill-input { display: block; width: 100%; height: 54px; padding: 10px 14px; border: 2.5px solid #22c55e; border-radius: 14px; background: #ffffff; color: #0f172a; font-size: 22px; font-weight: 900; outline: none; }
    .discount-badge { margin-top: 10px; font-size: 13px; color: #15803d; font-weight: 800; }
    
    .success { text-align: center; font-size: 17px; font-weight: 800; color: #15803d; }
    .success .big { margin: 12px 0 20px 0; font-size: 24px; font-weight: 900; color: #0f172a; }
    .photo-btn { background: #e2e8f0; border: 2.5px #c28b5e; color: #1e293b; padding: 14px; border-radius: 12px; font-size: 14px; font-weight: 800; text-align: center; cursor: pointer; display: flex; align-items: center; justify-content: center; min-height: 48px; margin-top: 0; }
    
    /* Layout split: Text area + Keypad */
    .sales-entry-split { display: flex-direction: column;flex; gap: 12px; align-items: stretch; margin-bottom: 16px; }
    .split-half { width:100%;flex: 1; display: flex; flex-direction: column; }
    
    /* Keypad Card */
    .keypad-card { background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 16px; padding: 10px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
    
    /* Horizontal Alphabet Scroller (Right to Left) */
    .alpha-scroller { display: flex; gap: 6px; overflow-x: auto; direction: rtl; padding-bottom: 6px; margin-bottom: 8px; scrollbar-width: none; }
    .alpha-scroller::-webkit-scrollbar { display: none; }
    .alpha-btn { flex: 0 0 32px; height: 32px; background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 13px; font-weight: 900; color: #0f172a; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .alpha-btn:active { background: #0f172a; color: #ffffff; }

    /* Number Keypad Grid */
    .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .key-btn { background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 10px; min-height: 40px; font-size: 16px; font-weight: 900; color: #0f172a; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .key-btn:active { background: #e2e8f0; }
  </style>
</head>

<body>
<div class="app-container">
  <div class="app-header">
    <img class="logo" src="https://i.postimg.cc/qqZRRLBQ/IMG-3743.jpg" alt="House of Viyora">
    <div class="brand-name">House of Viyora</div>
    <div class="page-title">Sales Entry</div>
  </div>

  <div id="error" class="error"></div>
  <div id="loading" class="loading">⏳ Syncing with Google Sheets…</div>

  <div id="entryCard" class="card">
    <!-- Customer Tabs -->
    <div style="margin-bottom: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <label style="margin-bottom: 0; font-size: 12px; font-weight: 800;">SELECT CUSTOMER TAB</label>
        <button type="button" class="secondary" onclick="addNewCustomerTab()" style="min-height: 32px; width: auto; margin-top: 0; padding: 4px 12px; font-size: 12px; border: 2px ">✚ New Customer</button>
      </div>
      <div id="tabContainer" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px;"></div>
    </div>

    <!-- Action Buttons Row: Scanner & Snap Photo -->
    <div style="display: flex; gap: 10px; margin-bottom: 12px;">
      <button type="button" class="secondary" style="flex: 1; margin-top: 0; min-height: 48px; font-weight: 800; border-radius: 12px; font-size: 14px;" onclick="startLiveScanner()">
       ⛶ QR
      </button>
      <label for="cameraInput" class="photo-btn" style="flex: 1;">
        📸 Snap
      </label>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="previewCapturedImage(event)">
    </div>

    <!-- Live Barcode Scanner & Close Button -->
    <div id="scannerWrapper" style="display: none; margin-bottom: 12px;">
      <div id="reader" style="width: 100%; border-radius: 12px; overflow: hidden;"></div>
      <button type="button" class="secondary" style="margin-top: 8px; min-height: 40px; background: #fee2e2; color: #991b1b; font-size: 14px;" onclick="stopLiveScanner()">
        ✕ Close Camera Scanner
      </button>
    </div>

    <div class="sales-entry-split">
      <!-- Left: Text Area -->
      <div class="split-half">
        <textarea id="productInput" oninput="saveCurrentTabState(); calculateLiveTotal();" placeholder="Product IDs "></textarea>
      </div>
    </div>

    <!-- Photo Preview Area -->
    <div id="photoPreviewArea" class="hidden" style="margin-top: 14px;">
      <div id="photoGrid" style="display:flex; flex-direction:column; gap:10px;"></div>
      <button type="button" class="secondary" style="margin-top:8px; min-height:36px; font-size:13px;" onclick="clearAllPhotos()">Clear All Photos</button>
    </div>

    <!-- Live Calculation Breakdown -->
    <div id="liveCalcBox" class="live-calc-box hidden">
      <div id="liveItemsList"></div>
      <div class="live-total-bar">
        <span>Subtotal (<span id="liveTotalQty">0</span> items)</span>
        <span id="liveTotalSum" class="live-item-price">₹0.00</span>
      </div>
    </div>

    <!-- Final Billing Section -->
    <div id="billingSection" class="final-bill-box hidden">
      <label for="finalBillInput" style="font-size: 13px; font-weight: 800; color: #166534; margin-bottom: 8px; display: block;">FINAL AMOUNT PAID BY CUSTOMER (₹)</label>
      <input type="number" class="final-bill-input" id="finalBillInput" min="0" step="0.01" inputmode="decimal" oninput="handleManualPaidInput();">
      <div class="discount-badge" id="discountBadge">No Discount Applied</div>
    </div>

    <button id="confirmAllBtn" class="confirm hidden" style="margin-top: 16px;" onclick="directConfirmSale()">✓ CONFIRM & RECORD SALE</button>
  </div>

  <!-- Success Card -->
  <div id="successCard" class="card hidden">
    <div class="success">
      <div>✅ SALE RECORDED</div>
      <div id="successSummary" class="big"></div>
      <div id="successItems"></div>
    </div>
    <button class="secondary" onclick="newSale()">+ NEXT CUSTOMER</button>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzcLo0PJ244tdAD4jItQrm6gWdVYm-Ttv2U0GSjnA__FlNoJ8UQV3RtrUfQqeBUSFu2Fg/exec";

  let LOCAL_INVENTORY = {};
  let customerTabs = [{ id: 1, name: 'Customer 1', input: '', photos: [], customPaid: null }];
  let activeTabId = 1;
  let capturedPhotos = [];

  function money(n) {
    return '₹' + Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function showError(message) {
    const el = document.getElementById('error');
    if (el) {
      el.textContent = message || 'Something went wrong.';
      el.style.display = 'block';
    }
  }

  function clearError() {
    const el = document.getElementById('error');
    if (el) el.style.display = 'none';
  }

  function loadLocalInventory() {
    const SPREADSHEET_ID = "1tS6jAnhR0JW-HFhal-9qS7VpleEooFpIgLGUyx_-gSI";
    const csvUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&t=` + Date.now();

    fetch(csvUrl, { cache: "no-store" })
      .then(res => {
        if (!res.ok) throw new Error("HTTP Status: " + res.status);
        return res.text();
      })
      .then(csvText => {
        if (!csvText || csvText.trim().startsWith("<!DOCTYPE html>")) {
          throw new Error("Sheet access blocked. Check sharing permissions ('Anyone with the link').");
        }

        LOCAL_INVENTORY = {};
        const lines = csvText.split(/\r\n|\n/);

        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);

          const productId = row[1] ? row[1].replace(/["']/g, "").trim().toUpperCase() : "";
          const name = row[2] ? row[2].replace(/["']/g, "").trim() : "";
          const selling = parseFloat(row[7]?.replace(/["'₹,\s]/g, "")) || 0;
          const stock = parseInt(row[8]?.replace(/["'\s]/g, "")) || 0;
          const image = row[10] ? row[10].replace(/["']/g, "").trim() : "";

          if (productId) {
            LOCAL_INVENTORY[productId] = {
              productId: productId,
              code: productId,
              name: name || productId,
              selling: selling,
              price: selling,
              stock: stock,
              image: image
            };
          }
        }
        clearError();
        calculateLiveTotal();
      })
      .catch(err => {
        console.error("Inventory fetch error:", err);
        showError("Inventory Sync Error: " + err.message);
      });
  }

  function findProductByInput(userInput) {
    if (!userInput || !LOCAL_INVENTORY) return null;
    let cleanInput = String(userInput).trim().toUpperCase();
    if (LOCAL_INVENTORY[cleanInput]) return LOCAL_INVENTORY[cleanInput];
    if (!isNaN(cleanInput) && cleanInput.length < 3) cleanInput = cleanInput.padStart(3, '0');
    if (LOCAL_INVENTORY[cleanInput]) return LOCAL_INVENTORY[cleanInput];
    
    for (let key of Object.keys(LOCAL_INVENTORY)) {
      if (key.endsWith("-" + cleanInput) || key.endsWith(cleanInput)) {
        return LOCAL_INVENTORY[key];
      }
    }
    return null;
  }

  function parseInput() {
    const text = document.getElementById('productInput').value.trim();
    if (!text) return [];
    return text.split(/\n|,/).map(line => {
      line = line.trim();
      if (!line) return null;
      let id = line, qty = 1;
      const match = line.match(/^(.+?)\s*[xX*]\s*(\d+)$/);
      if (match) { id = match[1].trim(); qty = Math.max(1, parseInt(match[2], 10)); }
      return { id, qty };
    }).filter(Boolean);
  }

  // Canvas Image Compression for Photos
  function previewCapturedImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const maxDim = 800;
        let width = img.width;
        let height = img.height;

        if (width > height && width > maxDim) {
          height *= maxDim / width;
          width = maxDim;
        } else if (height > maxDim) {
          width *= maxDim / height;
          height = maxDim;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.6);
        capturedPhotos.push({ id: Date.now() + Math.random(), base64: compressedBase64, price: 0 });

        renderPhotoGrid();
        saveCurrentTabState();
        calculateLiveTotal();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  }

  function updatePhotoPrice(index, value) {
    capturedPhotos[index].price = Number(value) || 0;
    saveCurrentTabState();
    calculateLiveTotal();
  }

  function removePhotoAt(index) {
    capturedPhotos.splice(index, 1);
    renderPhotoGrid();
    saveCurrentTabState();
    calculateLiveTotal();
  }

  function clearAllPhotos() {
    capturedPhotos = [];
    document.getElementById('cameraInput').value = "";
    renderPhotoGrid();
    saveCurrentTabState();
    calculateLiveTotal();
  }

  function renderPhotoGrid() {
    const area = document.getElementById('photoPreviewArea');
    const grid = document.getElementById('photoGrid');
    grid.innerHTML = '';

    if (capturedPhotos.length === 0) {
      area.classList.add('hidden');
      return;
    }

    area.classList.remove('hidden');
    capturedPhotos.forEach((item, idx) => {
      const card = document.createElement('div');
      card.style.cssText = 'display:flex; align-items:center; gap:10px; background:#f8fafc; border:1.5px solid #e2e8f0; padding:8px; border-radius:12px;';
      card.innerHTML = `
        <img src="${item.base64}" style="width:55px; height:55px; object-fit:cover; border-radius:8px; border:1px solid #cbd5e1; flex-shrink:0;">
        <div style="flex:1;">
          <label style="font-size:10px; margin-bottom:2px; display:block; color:#475569;">PHOTO #${idx + 1} PRICE (₹)</label>
          <input type="number" value="${item.price || ''}" oninput="updatePhotoPrice(${idx}, this.value)" placeholder="Price" min="0" step="1" inputmode="decimal" class="final-bill-input" style="height:36px; font-size:14px; padding:4px 8px;">
        </div>
        <button type="button" onclick="removePhotoAt(${idx})" style="background:#dc2626; color:#ffffff; border:none; border-radius:8px; width:34px; height:34px; min-height:34px; font-weight:800; cursor:pointer;">✕</button>
      `;
      grid.appendChild(card);
    });
  }

  let currentOriginalSubtotal = 0;
  function calculateLiveTotal() {
    const liveBox = document.getElementById('liveCalcBox');
    const liveList = document.getElementById('liveItemsList');
    const billingSection = document.getElementById('billingSection');
    const confirmBtn = document.getElementById('confirmAllBtn');
    
    let items = parseInput();
    saveCurrentTabState();

    if (items.length === 0 && capturedPhotos.length === 0) {
      liveBox.classList.add('hidden');
      billingSection.classList.add('hidden');
      confirmBtn.classList.add('hidden');
      currentOriginalSubtotal = 0;
      return;
    }

    liveBox.classList.remove('hidden');
    billingSection.classList.remove('hidden');
    confirmBtn.classList.remove('hidden');
    liveList.innerHTML = '';

    let totalQty = 0, totalSum = 0;
    items.forEach(item => {
      const product = findProductByInput(item.id);
      totalQty += item.qty;
      if (product) {
        const itemTotal = Number(product.selling || product.price || 0) * item.qty;
        totalSum += itemTotal;
        const thumbImg = product.image ? `<img src="${product.image}" class="live-item-thumb" alt="preview">` : `<div class="live-item-thumb" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:#64748b;">No Img</div>`;
        liveList.innerHTML += `
          <div class="live-item-row">
            <div class="live-item-left">
              ${thumbImg}
              <div>
                <div class="live-item-title">${product.name} (${item.qty}x)</div>
                <div class="live-item-sub">ID: ${product.productId}</div>
              </div>
            </div>
            <div class="live-item-price">${money(itemTotal)}</div>
          </div>`;
      } else {
        liveList.innerHTML += `
          <div class="live-item-row">
            <div class="live-item-left">
              <div class="live-item-thumb" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:#b45309;">ID</div>
              <div>
                <div class="live-item-title" style="color:#b45309;">ID: ${item.id} (${item.qty}x)</div>
                <div class="live-item-sub">Pending lookup</div>
              </div>
            </div>
            <div class="live-item-price">--</div>
          </div>`;
      }
    });

    capturedPhotos.forEach((photo, idx) => {
      totalQty += 1;
      const pPrice = Number(photo.price) || 0;
      totalSum += pPrice;
      liveList.innerHTML += `
        <div class="live-item-row">
          <div class="live-item-left">
            <img src="${photo.base64}" class="live-item-thumb" alt="photo">
            <div>
              <div class="live-item-title" style="color:#b45309;">📷 Photo Item #${idx + 1}</div>
              <div class="live-item-sub">Untagged Photo Sale</div>
            </div>
          </div>
          <div class="live-item-price">${money(pPrice)}</div>
        </div>`;
    });

    currentOriginalSubtotal = totalSum;
    document.getElementById('liveTotalQty').textContent = totalQty;
    document.getElementById('liveTotalSum').textContent = money(totalSum);

    const billInput = document.getElementById('finalBillInput');
    const activeTab = customerTabs.find(t => t.id === activeTabId);
    if (activeTab && activeTab.customPaid !== null) {
      billInput.value = activeTab.customPaid;
    } else {
      billInput.value = currentOriginalSubtotal;
    }
    calculateDiscount();
  }

  function handleManualPaidInput() {
    const activeTab = customerTabs.find(t => t.id === activeTabId);
    if (activeTab) activeTab.customPaid = document.getElementById('finalBillInput').value;
    saveCurrentTabState();
    calculateDiscount();
  }

  function calculateDiscount() {
    const paid = Number(document.getElementById('finalBillInput').value) || 0;
    const discount = currentOriginalSubtotal - paid;
    const badge = document.getElementById('discountBadge');
    if (discount > 0) {
      badge.textContent = 'Discount Given: ' + money(discount);
      badge.style.color = '#15803d';
    } else if (discount < 0) {
      badge.textContent = 'Extra Charged: ' + money(-discount);
      badge.style.color = '#b91c1c';
    } else {
      badge.textContent = 'No Discount Applied';
      badge.style.color = '#64748b';
    }
  }

  function directConfirmSale() {
    const items = parseInput();
    if (items.length === 0 && capturedPhotos.length === 0) { alert('List and photos are empty!'); return; }
    const totalPaid = Number(document.getElementById('finalBillInput').value);

    document.getElementById('entryCard').classList.add('hidden');
    document.getElementById('successCard').classList.remove('hidden');
    document.getElementById('successSummary').textContent = money(totalPaid) + ' Collected';

    const payloadPhotos = capturedPhotos.map(p => ({ base64: p.base64, price: Number(p.price) || 0 }));

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'checkoutApp', items: items, photos: payloadPhotos, totalPaid: totalPaid })
    })
    .catch(err => console.error("Sale sync error:", err));

    removeActiveTabAndSwitch();
  }

  // Keypad button actions
  function appendChar(char) {
    const el = document.getElementById('productInput');
    el.focus();
    const start = el.selectionStart;
    const end = el.selectionEnd;
    const val = el.value;
    el.value = val.substring(0, start) + char + val.substring(end);
    el.selectionStart = el.selectionEnd = start + char.length;
    saveCurrentTabState();
    calculateLiveTotal();
  }

  function backspaceChar() {
    const el = document.getElementById('productInput');
    el.focus();
    const start = el.selectionStart;
    const end = el.selectionEnd;
    const val = el.value;
    if (start > 0 || start !== end) {
      if (start === end) {
        el.value = val.substring(0, start - 1) + val.substring(end);
        el.selectionStart = el.selectionEnd = start - 1;
      } else {
        el.value = val.substring(0, start) + val.substring(end);
        el.selectionStart = el.selectionEnd = start;
      }
      saveCurrentTabState();
      calculateLiveTotal();
    }
  }

  // Live Barcode Scanner
  let scanner = null;
  function startLiveScanner() {
    document.getElementById('scannerWrapper').style.display = 'block';
    if (!scanner) scanner = new Html5Qrcode("reader");
    scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      decodedText => {
        const val = decodedText.split('|')[0].trim();
        const el = document.getElementById('productInput');
        el.value = el.value.trim() ? el.value + '\n' + val : val;
        stopLiveScanner();
        calculateLiveTotal();
      },
      err => {}
    ).catch(err => {
      alert("Camera error: " + err);
      stopLiveScanner();
    });
  }

  function stopLiveScanner() {
    if (scanner) {
      scanner.stop().then(() => {
        document.getElementById('scannerWrapper').style.display = 'none';
      }).catch(() => {
        document.getElementById('scannerWrapper').style.display = 'none';
      });
    } else {
      document.getElementById('scannerWrapper').style.display = 'none';
    }
  }

  // Multi-Customer Tabs Logic with Permanent State Persistence
  function saveCurrentTabState() {
    const tab = customerTabs.find(t => t.id === activeTabId);
    if (tab) {
      const inputEl = document.getElementById('productInput');
      const billEl = document.getElementById('finalBillInput');
      if (inputEl) tab.input = inputEl.value;
      if (billEl && tab.customPaid !== null) tab.customPaid = billEl.value;
      tab.photos = JSON.parse(JSON.stringify(capturedPhotos));
    }
    persistTabsToStorage();
    renderTabs();
  }

  function persistTabsToStorage() {
    try {
      localStorage.setItem('vyora_tabs_state', JSON.stringify({
        customerTabs: customerTabs,
        activeTabId: activeTabId
      }));
    } catch(e) {}
  }

  function loadTabsFromStorage() {
    try {
      const saved = localStorage.getItem('vyora_tabs_state');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed.customerTabs && parsed.customerTabs.length > 0) {
          customerTabs = parsed.customerTabs;
          const exists = customerTabs.some(t => t.id === parsed.activeTabId);
          activeTabId = exists ? parsed.activeTabId : customerTabs[0].id;
          return true;
        }
      }
    } catch(e) {}
    return false;
  }

  function addNewCustomerTab() {
    saveCurrentTabState();
    const newId = Date.now();
    const nextNum = customerTabs.length > 0 ? Math.max(...customerTabs.map((t, idx) => idx + 1)) + 1 : 1;
    customerTabs.push({ id: newId, name: `Customer ${nextNum}`, input: '', photos: [], customPaid: null });
    switchTab(newId);
  }

  function switchTab(id) {
    saveCurrentTabState();
    activeTabId = id;
    const tab = customerTabs.find(t => t.id === activeTabId);
    if (!tab) return;

    document.getElementById('productInput').value = tab.input || '';
    capturedPhotos = tab.photos ? JSON.parse(JSON.stringify(tab.photos)) : [];
    renderPhotoGrid();
    persistTabsToStorage();
    renderTabs();
    
    const liveBox = document.getElementById('liveCalcBox');
    const billingSection = document.getElementById('billingSection');
    const confirmBtn = document.getElementById('confirmAllBtn');
    const items = parseInput();

    if (items.length === 0 && capturedPhotos.length === 0) {
      liveBox.classList.add('hidden');
      billingSection.classList.add('hidden');
      confirmBtn.classList.add('hidden');
      currentOriginalSubtotal = 0;
    } else {
      calculateLiveTotal();
    }
  }

  function removeActiveTabAndSwitch() {
    customerTabs = customerTabs.filter(t => t.id !== activeTabId);

    if (customerTabs.length === 0) {
      customerTabs = [{ id: Date.now(), name: 'Customer 1', input: '', photos: [], customPaid: null }];
    }

    activeTabId = customerTabs[0].id;
    persistTabsToStorage();
    
    const tab = customerTabs[0];
    document.getElementById('productInput').value = tab.input || '';
    capturedPhotos = tab.photos ? JSON.parse(JSON.stringify(tab.photos)) : [];
    renderPhotoGrid();
    renderTabs();
  }

  function renderTabs() {
    const container = document.getElementById('tabContainer');
    if (!container) return;
    container.innerHTML = '';
    
    customerTabs.forEach(tab => {
      const btn = document.createElement('button');
      btn.type = 'button';
      const hasContent = (tab.input && tab.input.trim()) || (tab.photos && tab.photos.length > 0);
      btn.textContent = tab.name + (hasContent ? ' ●' : '');
      const isActive = tab.id === activeTabId;
      btn.style.cssText = `min-height: 36px; width: auto; margin-top: 0; padding: 6px 14px; font-size: 13px; font-weight: 800; border-radius: 10px; cursor: pointer; border: 2px solid ${isActive ? '#0f172a' : '#cbd5e1'}; background: ${isActive ? '#0f172a' : '#ffffff'}; color: ${isActive ? '#ffffff' : '#0f172a'}; white-space: nowrap; flex-shrink: 0;`;
      btn.onclick = () => switchTab(tab.id);
      container.appendChild(btn);
    });
  }

  function newSale() {
    document.getElementById('successCard').classList.add('hidden');
    document.getElementById('entryCard').classList.remove('hidden');
    
    if (customerTabs.length > 0) {
      switchTab(customerTabs[0].id);
    } else {
      customerTabs = [{ id: Date.now(), name: 'Customer 1', input: '', photos: [], customPaid: null }];
      activeTabId = customerTabs[0].id;
      switchTab(activeTabId);
    }
    calculateLiveTotal();
  }

  window.onload = () => {
    loadTabsFromStorage();
    loadLocalInventory();
    switchTab(activeTabId);
  };
</script>
</body>
</html>
